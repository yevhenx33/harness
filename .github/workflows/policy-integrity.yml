name: policy-integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy-integrity:
    name: policy-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install verification dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify policy integrity
        run: python3 scripts/verify_policy.py
      - name: Verify security skill integrity
        run: python3 scripts/verify_skills.py
      - name: Test integrity failure paths
        run: python3 -m unittest discover -s tests -v
